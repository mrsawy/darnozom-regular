# Production nginx for darnozom.com
# Installed to: /etc/nginx/sites-available/darnozom

# HTTP: ACME challenge + redirect to HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name darnozom.com www.darnozom.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS site
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name darnozom.com www.darnozom.com;

    ssl_certificate     /etc/letsencrypt/live/darnozom.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/darnozom.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/darnozom;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Uncomment when API backend is on this host
    # location /api/ {
    #     proxy_pass http://127.0.0.1:3000;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
