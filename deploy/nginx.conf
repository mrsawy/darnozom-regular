# Production nginx for darnozom.com
# Installed to: /etc/nginx/sites-available/darnozom
#
# The api.darnozom.com server block lives in nginx.api.conf and is installed
# separately by setup-ssl.sh, only once that subdomain has its own certificate.

# HTTP: ACME challenge + redirect to HTTPS.
# This is the default_server, so challenges for api.darnozom.com land here too,
# which is what lets certbot issue the API certificate over the same webroot.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name darnozom.com www.darnozom.com api.darnozom.com ecommerce.darnozom.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS site
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name darnozom.com www.darnozom.com;

    ssl_certificate     /etc/letsencrypt/live/darnozom.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/darnozom.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/darnozom;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The SPA calls the API with relative /api/... URLs, so proxying here keeps
    # the frontend code unchanged and same-origin.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Report/document generation and AI streaming can outrun the default 60s.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Book covers arrive as inline base64 data URIs; express accepts 5mb.
        client_max_body_size 10m;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
