# ecommerce.darnozom.com — Medusa Store API and admin dashboard.
#
# Installed to /etc/nginx/sites-available/darnozom-medusa by setup-ssl.sh, and
# ONLY once /etc/letsencrypt/live/ecommerce.darnozom.com/ exists.
# Port 80 for this hostname is handled by the default_server in nginx.conf.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ecommerce.darnozom.com;

    ssl_certificate     /etc/letsencrypt/live/ecommerce.darnozom.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ecommerce.darnozom.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    # Product images uploaded via Medusa Admin / Create Book land in
    # /opt/darnozom/medusa-uploads (see MEDUSA_UPLOAD_DIR in deploy.sh).
    # The file-local provider stamps URLs as {backend_url}/{fileKey} with
    # backend_url = https://ecommerce.darnozom.com/static — Medusa itself
    # does not mount that directory, so without this location every product
    # image 404s on the storefront.
    location /static/ {
        alias /opt/darnozom/medusa-uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:9010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
