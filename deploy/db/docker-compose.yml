# Postgres for darnozom — used identically in local development and on the
# production VPS. Production supplies POSTGRES_PASSWORD via /opt/darnozom/db/.env;
# locally it falls back to the dev password below.
#
# This container also hosts the `medusa` database (Medusa v2 commerce backend,
# apps/medusa) alongside the primary `darnozom` database — same Postgres
# instance, no separate service block.
#
#   local: pnpm dev:db
#   prod:  run by deploy/deploy.sh

services:
  db:
    image: postgres:16
    container_name: darnozom-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-darnozom}
      POSTGRES_USER: ${POSTGRES_USER:-darnozom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-darnozom}
    ports:
      # Bound to loopback only — nginx and the API reach it over localhost, and
      # the port is never exposed to the public internet.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - darnozom_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-darnozom} -d ${POSTGRES_DB:-darnozom}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  darnozom_pgdata:
    name: darnozom_pgdata
