# api.darnozom.com — direct access to the API for webhooks, payment provider
# callbacks (Paymob / PayPal) and future non-web clients.
#
# Installed to /etc/nginx/sites-available/darnozom-api by setup-ssl.sh, and ONLY
# once /etc/letsencrypt/live/api.darnozom.com/ exists. Installing it without the
# certificate would make `nginx -t` fail and take the main site down with it.
#
# Port 80 for this hostname is handled by the default_server in nginx.conf.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.darnozom.com;

    ssl_certificate     /etc/letsencrypt/live/api.darnozom.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.darnozom.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
